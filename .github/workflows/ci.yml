name: CI

on:
  push:
    branches:
      - main
    paths:
      - raven/**
  pull_request:
    paths:
      - raven/**

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Server

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      # Stable key; drift is detected post-restore (see install.sh), so frappe
      # schema churn never forces a full reprovision.
      - name: Compute bench cache key
        id: bench-key
        run: echo "key=${{ runner.os }}-pilot-bench-raven-develop-py3.14-extdb" >> "$GITHUB_OUTPUT"

      - name: Restore Pilot bench
        id: bench-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/pilot/benches
            ~/.config/systemd/user
            ~/db-snapshot
          key: ${{ steps.bench-key.outputs.key }}

      - name: Setup Pilot bench
        shell: bash
        env:
          FRAPPE_BRANCH: develop
          PILOT_CACHE_HIT: ${{ steps.bench-cache.outputs.cache-hit }}
        run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh

      - name: Save Pilot bench
        if: steps.bench-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/pilot/benches
            ~/.config/systemd/user
            ~/db-snapshot
          key: ${{ steps.bench-key.outputs.key }}

      - name: Install app under test
        shell: bash
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          export PATH="$HOME/pilot/bin:$HOME/.local/bin:$PATH"
          # The cached bench never contains this app, so every run installs
          # fresh PR code. The site database was restored during provisioning.
          pilot get-app "${GITHUB_WORKSPACE}" --branch "${GITHUB_SHA}" --skip-assets
          pilot install-app test_site raven

      - name: Run Tests
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          pilot frappe --site test_site set-config allow_tests true
          pilot frappe --site test_site run-tests --app raven
        env:
          TYPE: server
