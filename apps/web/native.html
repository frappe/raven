<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Raven</title>
  <!-- The theme before first paint: the class is what index.css reads, so no frame of a reload shows the other theme. -->
  <style>html{background:#fff}html.dark{background:#171717}</style>
  <script>try{var t=localStorage.getItem("raven-theme");if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.classList.add(t)}catch(e){}</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/native/main.tsx"></script>
</body>

</html>
